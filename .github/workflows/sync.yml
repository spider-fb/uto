name: Sync RSS to Blogger
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "test أو production (فارغ = settings.json)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: rss-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build
        run: mvn -B -q -DskipTests package
      - name: Run sync
        run: java -jar target/rss-to-blogger.jar
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TARGET: ${{ inputs.target }}
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || { git commit -m "sync: update state [skip ci]"; git pull --rebase; git push; }
